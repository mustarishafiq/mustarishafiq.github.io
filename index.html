<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mustari Shafiq @ MUSISME</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at top, #1a1a1a 0%, #0b0b0b 45%, #050505 100%);
            color: #f5f5f5;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .card {
            width: 100%;
            max-width: 480px;
            padding: 42px;
            position: relative;
            overflow: hidden;
            border: 1px solid #292929;
            border-radius: 24px;
            background: rgba(17, 17, 17, 0.92);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .card::before {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            top: -90px;
            right: -70px;
            border-radius: 50%;
            background: #ffffff;
            opacity: 0.04;
            filter: blur(10px);
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 28px;
            padding: 7px 12px;
            border: 1px solid #303030;
            border-radius: 999px;
            color: #a8a8a8;
            background: #141414;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .tag span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #62e88b;
            box-shadow: 0 0 12px rgba(98, 232, 139, 0.7);
        }

        h1 {
            font-size: clamp(36px, 8vw, 54px);
            line-height: 0.98;
            letter-spacing: -0.05em;
            margin-bottom: 12px;
        }

        .handle {
            color: #858585;
            font-size: 17px;
            margin-bottom: 28px;
        }

        .role {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 26px;
        }

        .divider {
            height: 1px;
            background: #292929;
            margin: 26px 0;
        }

        .label {
            margin-bottom: 12px;
            color: #666;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
        }

        .skill {
            padding: 9px 13px;
            border: 1px solid #303030;
            border-radius: 10px;
            color: #cfcfcf;
            background: #151515;
            font-size: 13px;
            transition: 0.2s ease;
        }

        .skill:hover {
            border-color: #555;
            color: #fff;
            transform: translateY(-2px);
        }

        .quote {
            margin-top: 28px;
            padding: 18px 20px;
            border-left: 2px solid #fff;
            background: linear-gradient(90deg, #1b1b1b, transparent);
            color: #ddd;
            font-size: 15px;
            font-style: italic;
        }

        .footer {
            margin-top: 30px;
            color: #555;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 24px;
                border-radius: 20px;
            }

            h1 {
                font-size: 38px;
            }
        }
    </style>
</head>

<body>

    <main class="card">
        <div class="tag">
            <span></span>
            Developer
        </div>

        <h1>Mustari<br>Shafiq</h1>

        <div class="handle">@ MUSISME</div>

        <div class="role">Developer</div>

        <div class="divider"></div>

        <div class="label">Skills</div>

        <div class="skills">
            <div class="skill">Linux</div>
            <div class="skill">Git</div>
            <div class="skill">Infrastructure</div>
            <div class="skill">DevOps</div>
            <div class="skill">Laravel</div>
            <div class="skill">React</div>
        </div>

        <div class="quote">
            “Go hard or go home.”
        </div>

        <div class="footer">
            Build · Deploy · Repeat
        </div>
    </main>

</body>
</html>
